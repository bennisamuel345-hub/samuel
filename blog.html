<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

     <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<style>

     /* Dashboard image */
        .dashboard-image {

            /* Smooth animation */
            transition:
                transform 0.4s ease,
                box-shadow 0.4s ease,
                filter 0.4s ease;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.12);

            cursor: pointer;
        }

        /* Animation when cursor touches image */
        .dashboard-image:hover {
            transform:
                translateY(-12px)
                scale(1.03)
                rotateX(2deg)
                rotateY(-2deg);

            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.22);

            filter: brightness(1.03);
        }

        /* Extra click animation */
        .dashboard-image:active {
            transform:
                translateY(-4px)
                scale(0.99)
                rotateX(0deg)
                rotateY(0deg);
        }

</style>
<body>
    <div></div>

        <div class="col-lg-6 col-12">

            <a href="https://bennisamuel345-hub.github.io/sam/" class="dashboard-image dashboard-image:hover dashboard-image:active">
                <img width="49%" src="img/dasboard.png" alt="" class="mt-5">
            </a>

            <a href="https://bennisamuel345-hub.github.io/ben/" class="dashboard-image dashboard-image:hover dashboard-image:active">
